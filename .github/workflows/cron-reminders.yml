name: Scheduled Reminders Cron

on:
  schedule:
    # Runs at the top of every hour (UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  trigger-reminders:
    name: Dispatch Hourly Workout & Nutrition Reminders
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cron Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://zgym.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET secret is not set in repository settings."
            exit 1
          fi

          echo "Triggering reminders cron on $APP_URL..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response status: $HTTP_STATUS"
          echo "Response body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Cron dispatch failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Reminders dispatched successfully!"
